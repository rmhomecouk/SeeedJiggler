# Builds the app on every push to main and publishes it as the rolling "latest" release.
# The app's update checker reads this release: its notes carry the full commit hash, and the
# binary has a .sha256 file next to it.
name: release
on:
  push:
    branches: [main]
    paths: ['menubar/**', 'scripts/build.sh', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false  # never cancel between deleting and recreating the release

jobs:
  build:
    runs-on: macos-latest   # Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: scripts/build.sh
      - name: Package
        run: |
          mkdir -p out
          cp build/SeeedJiggler out/SeeedJiggler-macos-arm64
          (cd out && shasum -a 256 SeeedJiggler-macos-arm64 > SeeedJiggler-macos-arm64.sha256)
          file out/SeeedJiggler-macos-arm64
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          printf 'commit: %s\n\nRolling build of main. Installed by the app'"'"'s "Check for updates" (it asks first).\n' "$SHA" > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* --target "$SHA" --title "SeeedJiggler ${SHA:0:7}" --notes-file notes.md --prerelease
